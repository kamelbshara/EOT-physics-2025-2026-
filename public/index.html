<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>الهيكل 100 مع استاذ احمد غرايبة</title><link rel="stylesheet" href="./student-theme.css"><link rel="stylesheet" href="./study.css"><script type="module" src="./study.js"></script></head>
<body class="student-design"><main>
<header class="mast"><b class="symbol">Φ</b><div><strong>الهيكل 100 مع استاذ احمد غرايبة</strong><small>ADVANCED PHYSICS · 2026–2027</small></div><button id="open-floating-calculator" aria-expanded="false">الآلة الحاسبة</button></header>
<p id="notice" role="status"></p>
<section id="dashboard"><div class="hero"><div><small>الفيزياء · المسار المتقدم</small><h1>تدرّب على الهيكل</h1><p>اختر صفّك، ثم تدرّب على كل مؤشر من مؤشرات تغطية الامتحان.</p></div><div class="orbit" aria-hidden="true">Φ</div></div>
<div class="line" id="gradeTabs" aria-label="الصف"></div><section class="heading"><div><small>بنك الأسئلة</small><h2 id="gradeTitle"></h2></div><button id="mockStart">اختبار تجريبي</button></section><button id="resumeMock" hidden></button><div class="grid" id="cards"></div></section>
<section id="lesson" hidden><div class="heading"><button id="back">→ مؤشرات الهيكل</button><strong id="clock"></strong></div><small id="unit"></small><h1 id="title"></h1><div class="chips" id="nav"></div><article class="paper watermarked-question"><div id="wm"></div><small id="meta"></small><h2 id="stem"></h2><details><summary>English</summary><p id="english" dir="ltr" lang="en"></p></details><div id="images"></div><div id="inputs"></div><div class="line"><button class="primary" id="check"></button><button id="hint">تلميح</button><button id="manual">دليل الحاسبة</button><button id="next">التالي ←</button></div><p id="hintText" hidden></p><section id="result" aria-live="polite" hidden></section></article></section>
<dialog id="login"><form id="loginForm"><h2>بدء التدريب</h2><label>اسم الطالب<input id="name" required minlength="2" maxlength="80" autocomplete="given-name"></label><button class="primary">حفظ ومتابعة</button></form></dialog>
<dialog id="guide"><button id="closeGuide">إغلاق</button><div id="guideBody"></div></dialog>
<section id="floating-calculator" hidden><div class="floating-calculator-bar">ClassWiz <button id="calculator-dock-left">◀</button><button id="calculator-dock-right">▶</button><button id="calculator-close" aria-label="إغلاق">×</button></div><iframe title="حاسبة ClassWiz العلمية"></iframe></section>
</main></body></html>
