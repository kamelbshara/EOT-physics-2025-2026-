name: Deploy Physics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: physics-pages
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check published page, calculator and database API
        env:
          SITE: https://kamelbshara.github.io/EOT-physics-2025-2026-
          API: ${{ vars.PHYSICS_API_ORIGIN || 'https://physics-api-production.up.railway.app' }}
        run: |
          curl -fsSL --retry 3 "$SITE/" -o /tmp/physics-index
          grep -Fq 'الهيكل 100 مع استاذ احمد غرايبة' /tmp/physics-index
          curl -fsSL --retry 3 "$SITE/api-config.js" | grep -F "$API"
          curl -fsSL --retry 3 "$SITE/vendor/fx991ce/src/index.html" | grep -F 'fx-991CE X'
          curl -fsS --retry 3 -H 'Origin: https://kamelbshara.github.io' -D /tmp/physics-headers "$API/api/catalog" -o /tmp/physics-catalog
          grep -iq '^access-control-allow-origin: https://kamelbshara.github.io' /tmp/physics-headers
          jq -e '(.cards | length) == 80' /tmp/physics-catalog
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build:pages
        env:
          PHYSICS_API_ORIGIN: ${{ vars.PHYSICS_API_ORIGIN || 'https://physics-api-production.up.railway.app' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deploy
        uses: actions/deploy-pages@v4
