name: Deploy Physics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: physics-pages
  cancel-in-progress: false
jobs:
  verify-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-bank.mjs
  e2e:
    needs: verify-bank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e.mjs
  # Publishes the student interface to the gh-pages branch, which the live site serves from.
  deploy-gh-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-bank, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: physics-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:pages
        env:
          PHYSICS_API_ORIGIN: ${{ vars.PHYSICS_API_ORIGIN || 'https://haykal100.vercel.app' }}
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Commit the new build to gh-pages
        run: |
          rsync -a --delete --exclude .git dist/pages/ site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -m "Deploy ${GITHUB_SHA::7} from main"
          git push origin gh-pages
  verify-live:
    needs: deploy-gh-pages
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check published page, calculator and database API
        env:
          SITE: https://kamelbshara.github.io/EOT-physics-2025-2026-
          API: ${{ vars.PHYSICS_API_ORIGIN || 'https://haykal100.vercel.app' }}
        run: |
          for attempt in {1..30}; do
            curl -fsSL "$SITE/?v=$GITHUB_SHA" -o /tmp/physics-index && grep -Fq 'id="outcomesLink"' /tmp/physics-index && break
            sleep 5
          done
          grep -Fq '<html lang="en" dir="ltr">' /tmp/physics-index
          grep -Fq 'id="school"' /tmp/physics-index
          grep -Fq 'id="outcomesLink"' /tmp/physics-index
          for attempt in {1..30}; do
            curl -fsSL "$SITE/outcomes.html?v=$GITHUB_SHA" -o /tmp/physics-outcomes && grep -Fq 'href="./#G12A-Q20"' /tmp/physics-outcomes && break
            sleep 5
          done
          test "$(grep -c 'href="./#G' /tmp/physics-outcomes)" -eq 80
          for grade in 9 10 11 12; do
            test "$(grep -c "<li id=\"g${grade}-q" /tmp/physics-outcomes)" -eq 20
          done
          grep -Fq 'id="figureViewer"' /tmp/physics-index
          grep -Fq 'id="lawsTab"' /tmp/physics-index
          grep -Fq 'id="examplesTab"' /tmp/physics-index
          curl -fsSL --retry 3 "$SITE/worked/grade-12.js" -o /tmp/worked-12.js
          grep -Fq 'G12A-Q20' /tmp/worked-12.js
          curl -fsSL --retry 3 "$SITE/plates/27.png" -o /tmp/photoelectric.png
          test "$(file -b --mime-type /tmp/photoelectric.png)" = image/png
          curl -fsSL --retry 3 "$SITE/math-input.js" -o /tmp/math-input.js
          grep -Fq 'mathlive.min.mjs' /tmp/math-input.js
          grep -Fq 'Haykal100 في الفيزياء مع استاذ احمد غرايبة' /tmp/physics-index
          curl -fsSL --retry 3 "$SITE/api-config.js" | grep -F "$API"
          curl -fsSL --retry 3 "$SITE/vendor/fx991ce/src/index.html" | grep -F 'fx-991CE X'
          for attempt in {1..36}; do
            curl -fsS --retry 1 -H 'Origin: https://kamelbshara.github.io' -D /tmp/physics-headers "$API/api/catalog" -o /tmp/physics-catalog && jq -e '([.cards[].total] | add) == 675 and all(.cards[]; .total >= 5 and .bookPages and .examType == (if .slot <= 16 then "MCQ" else "FRQ" end))' /tmp/physics-catalog && break
            sleep 5
          done
          grep -iq '^access-control-allow-origin: https://kamelbshara.github.io' /tmp/physics-headers
          jq -e '(.cards | length) == 80 and ([.cards[].total] | add) == 675 and all(.cards[]; .total >= 5 and .bookPages and .examType == (if .slot <= 16 then "MCQ" else "FRQ" end))' /tmp/physics-catalog
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build:pages
        env:
          PHYSICS_API_ORIGIN: ${{ vars.PHYSICS_API_ORIGIN || 'https://haykal100.vercel.app' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deploy
        uses: actions/deploy-pages@v4
