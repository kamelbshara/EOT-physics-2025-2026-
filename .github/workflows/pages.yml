name: Deploy Physics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: physics-pages
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check published page, calculator and database API
        env:
          SITE: https://kamelbshara.github.io/EOT-physics-2025-2026-
          API: ${{ vars.PHYSICS_API_ORIGIN || 'https://physics-api-production.up.railway.app' }}
        run: |
          for attempt in {1..30}; do
            curl -fsSL "$SITE/?v=$GITHUB_SHA" -o /tmp/physics-index && grep -Fq 'id="outcomesLink"' /tmp/physics-index && break
            sleep 5
          done
          grep -Fq '<html lang="en" dir="ltr">' /tmp/physics-index
          grep -Fq 'id="school"' /tmp/physics-index
          grep -Fq 'id="outcomesLink"' /tmp/physics-index
          curl -fsSL --retry 3 "$SITE/outcomes.html" -o /tmp/physics-outcomes
          for grade in 9 10 11 12; do
            test "$(grep -c "<li id=\"g${grade}-q" /tmp/physics-outcomes)" -eq 20
          done
          grep -Fq 'id="figureViewer"' /tmp/physics-index
          grep -Fq 'id="lawsTab"' /tmp/physics-index
          grep -Fq 'id="examplesTab"' /tmp/physics-index
          curl -fsSL --retry 3 "$SITE/worked/grade-12.js" -o /tmp/worked-12.js
          grep -Fq 'G12A-Q20' /tmp/worked-12.js
          curl -fsSL --retry 3 "$SITE/plates/27.png" -o /tmp/photoelectric.png
          test "$(file -b --mime-type /tmp/photoelectric.png)" = image/png
          curl -fsSL --retry 3 "$SITE/math-input.js" -o /tmp/math-input.js
          grep -Fq 'mathlive.min.mjs' /tmp/math-input.js
          grep -Fq 'الهيكل 100 مع استاذ احمد غرايبة' /tmp/physics-index
          curl -fsSL --retry 3 "$SITE/api-config.js" | grep -F "$API"
          curl -fsSL --retry 3 "$SITE/vendor/fx991ce/src/index.html" | grep -F 'fx-991CE X'
          for attempt in {1..36}; do
            curl -fsS --retry 1 -H 'Origin: https://kamelbshara.github.io' -D /tmp/physics-headers "$API/api/catalog" -o /tmp/physics-catalog && jq -e '([.cards[].total] | add) == 675' /tmp/physics-catalog && break
            sleep 5
          done
          grep -iq '^access-control-allow-origin: https://kamelbshara.github.io' /tmp/physics-headers
          jq -e '(.cards | length) == 80 and ([.cards[].total] | add) == 675' /tmp/physics-catalog
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build:pages
        env:
          PHYSICS_API_ORIGIN: ${{ vars.PHYSICS_API_ORIGIN || 'https://physics-api-production.up.railway.app' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deploy
        uses: actions/deploy-pages@v4
