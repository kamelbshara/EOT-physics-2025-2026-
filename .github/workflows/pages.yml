name: Deploy Physics to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: physics-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build:pages
        env:
          PHYSICS_API_ORIGIN: ${{ vars.PHYSICS_API_ORIGIN || 'https://physics-api-production.up.railway.app' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deploy
        uses: actions/deploy-pages@v4
